{% set name = "nicegui" %}
{% set version = "3.18.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/zauberzeug/nicegui/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 32cd80209b3dee6285aa9c2406e8cc824644eaf79d6177627705eba2472f00f1

build:
  noarch: python
  number: 0
  script:
    # The archive has no .git, so poetry-dynamic-versioning otherwise resolves
    # against whatever repository encloses the build directory.
    - export POETRY_DYNAMIC_VERSIONING_BYPASS={{ version }}  # [unix]
    - {{ PYTHON }} -m pip install . -vv --no-build-isolation

requirements:
  build:
    - python >=3.9
    - pip
  host:
    - python {{ python_min }}
    - pip
    - poetry-core >=1.0.0
    - poetry-dynamic-versioning >=1.0.0,<2.0.0
  run:
    - python >={{ python_min }}
    - typing-extensions >=4.0.0
    - markdown2 >=2.4.7,!=2.4.11
    - pygments >=2.20.0,<3.0.0
    - starlette >=1.3.1
    - uvicorn-standard >=0.22.0
    - fastapi >=0.109.1,!=0.123.5
    - python-socketio >=5.16.2
    - jinja2 >=3.1.6,<4
    - python-multipart >=0.0.31
    - orjson >=3.11.5
    - itsdangerous >=2.1.2,<3
    - aiofiles >=23.1.0
    - httpx >=0.24.0
    - ifaddr >=0.2.0
    - docutils >=0.19
    - h11 >=0.16.0
    - anyio >=4.14.2
    - aiohttp >=3.14.3
    - multidict >=6.9.1
    - certifi >=2024.07.04
    - pydantic-core >=2.35.0
    - python-dotenv >=1.2.2
    - idna >=3.15
    - tinycss2 >=1.4.0,<2


test:
  requires:
    - python {{ python_min }}
    - pip
  imports:
    - nicegui
  commands:
    - pip check

about:
  home: https://github.com/zauberzeug/nicegui
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: Create web-based interfaces with Python. The nice way.
  doc_url: https://nicegui.io/
  dev_url: https://github.com/zauberzeug/nicegui

extra:
  recipe-maintainers:
    - rodja
    - falkoschindler
